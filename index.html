<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="./app.js" defer></script>
    <title>Doneen's DOM</title>
</head>

<body class="bg-info-subtle">
    <h1>To Do List</h1>
    <div>
        <div >
                <p class="container mt-12 form-control d-flex justify-content-center align-items-center bg-info-subtle">
                    <input type="date" id="todayDate" placeholder="todayDate" /> Today's Date
                </p>                
            
            <input type="text" class="container mt-4 d-flex justify-content-center" id="todoInput" placeholder="Enter A Task" />
            
            <br>
            
                <select class="btn btn-primary form-select mb-3" id="selectCategory" placeholder="Category">
                    <option value="Category">Select Category</option>
                    <option value="Work">Work</option>
                    <option value="Personal">Personal</option>
                    <option value="School">School</option>
                    <option value="Family">Family</option>
                </select>
                <p>
                <p class="container mt-12 form-control d-flex justify-content-center align-items-center bg-info-subtle">
                    <input type="date" id="deadline" placeholder="deadline" /> Task Deadline
                </p>

                <select class="btn btn-primary form-select mb-3" id="taskStatus" placeholder="Task Status">
                    <option value="">Select Task Status</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Not Started">Not Started</option>
                    <option value="Completed">Completed</option>
                </select>
                <button class="btn btn-success d-flex container justify-content-center" id="addButton">+ Add Task To List +</button>
        </div>
        <div>
            <br>
            <label>Filter by Status:</label>
            <select id="filterStatus">
                <option value="All">All Tasks</option>
                <option value="Not Started">Not Started</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
            </select>

            <label >Filter by Category:</label>
            <select id="filterCategory">
                <option value="All">All Categories</option>
                <option value="Work">Work</option>
                <option value="Personal">Personal</option>
                <option value="School">School</option>
                <option value="Family">Family</option>
            </select>
            <br>
            <br>
                    <ul id="todoList"> </ul>
            </div>
        </div>
    </div>
</body>

</html>
